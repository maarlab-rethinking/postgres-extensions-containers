name: Publish Extension Image Catalogs

# Fork-only. Upstream's `update-catalogs.yml` writes into
# `cloudnative-pg/artifacts`, which this fork cannot and must not touch. This
# workflow does the equivalent work for consumers of the Citus image and
# publishes the result here instead. See FORK.md.

on:
  schedule:
    # Upstream refreshes its catalogs on Mondays at 09:00 UTC; pick them up
    # once they have landed.
    - cron: "0 12 * * 1"
  workflow_dispatch:
  # A new Citus image on `main` makes the published catalogs stale.
  workflow_run:
    workflows: ["Build, test and publish Citus"]
    types: [completed]
    branches: [main]

permissions: read-all

defaults:
  run:
    shell: "bash -Eeuo pipefail -x {0}"

env:
  BRANCH: chore/refresh-catalogs

jobs:
  publish-catalogs:
    name: Composing catalogs
    # `workflow_run` fires for failed builds too.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    permissions:
      # Push the branch the pull request is opened from.
      contents: write
      pull-requests: write
      # Keyless signing.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main

      - name: Ensure yq is available
        env:
          # renovate: datasource=github-releases depName=mikefarah/yq
          YQ_VERSION: v4.53.6
        run: |
          if ! command -v yq >/dev/null; then
            sudo curl -fsSL -o /usr/local/bin/yq \
              "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
            sudo chmod +x /usr/local/bin/yq
          fi
          yq --version

      - name: Compose catalogs
        run: |
          for distro in bookworm trixie; do
            image="$(hack/resolve-citus-image.sh "${distro}")"
            hack/compose-extension-catalog.sh "${distro}" "${image}" \
              > "catalogs/catalog-minimal-${distro}.yaml"
          done

      - name: Decide whether there is anything to publish
        id: changed
        run: |
          # A signing bundle is fresh on every run even when the catalog it
          # covers is byte-identical, so the catalogs alone decide. Missing
          # bundles also count: that is the state right after a catalog is
          # added by hand.
          publish=false
          git diff --quiet -- 'catalogs/*.yaml' || publish=true
          for file in catalogs/*.yaml; do
            [ -f "${file}.sigstore.json" ] || publish=true
          done
          if [ "${publish}" = false ]; then
            git checkout -- catalogs/
          fi
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        if: steps.changed.outputs.publish == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign catalogs
        if: steps.changed.outputs.publish == 'true'
        run: |
          for file in catalogs/*.yaml; do
              echo "Signing ${file}..."
              cosign sign-blob "${file}" --bundle "${file}.sigstore.json" --yes
          done

      - name: Open a pull request
        if: steps.changed.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # `main` requires a pull request, and these are digest bumps of
          # somebody else's images: they deserve a review, not a direct push.
          git config user.name "maarlab Automated Updates"
          git config user.email "noreply@maarlab.com"
          git switch -C "${BRANCH}"
          git add catalogs
          git commit -m "chore: refresh extension image catalogs"
          git push --force origin "${BRANCH}"

          if [ -z "$(gh pr list --head "${BRANCH}" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base main --head "${BRANCH}" \
              --title "chore: refresh extension image catalogs" \
              --body "Recomposed from upstream's \`image-catalogs-extensions\` with this fork's Citus image appended, and re-signed. Triggered by \`${{ github.event_name }}\`."
          fi
